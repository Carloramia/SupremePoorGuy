*{box-sizing:border-box}body{font:16px/1.6 system-ui,sans-serif;background:#17191c;color:#eee;margin:32px auto;padding:0 24px;max-width:1500px}
h1,h2{font-weight:600}p{color:#b9bdc5}a{color:#efb468}header{margin-bottom:32px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-bottom:36px}
