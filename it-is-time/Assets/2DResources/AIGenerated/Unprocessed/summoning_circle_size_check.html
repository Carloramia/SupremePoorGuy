<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>召唤阵图标 · 小尺寸对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e3d8;color:#27231f;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1020px;margin:auto;padding:28px}h1{font-size:25px;margin:0 0 6px}p{margin:0 0 22px;color:#655d52}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{border:1px solid #c9beac;border-radius:8px;padding:20px;background:#f6f1e8}h2{font-size:17px;margin:0 0 15px}.large{display:block;width:256px;height:256px;max-width:100%;object-fit:contain;margin:0 auto 20px}.sizes{display:grid;grid-template-columns:70px 90px 1fr;gap:12px;align-items:end;min-height:170px}.cell{display:flex;flex-direction:column;align-items:center;gap:10px}small{color:#655d52}.dark{margin-top:20px;padding:18px;background:#27231f;color:#f0e3ce;display:flex;gap:32px;align-items:center;border-radius:8px}.dark span{flex:1}img{object-fit:contain;image-rendering:auto}.note{margin-top:18px;font-size:13px}@media(max-width:650px){main{padding:14px}.grid{grid-template-columns:1fr}}
@media(max-width:650px){.sizes{grid-template-columns:32px 64px 128px;gap:8px;justify-content:space-between}.cell small{font-size:11px;white-space:nowrap}.dark{flex-wrap:wrap;gap:16px}.dark span{flex-basis:100%}}
</style>
<main>
<h1>召唤阵图标 · 小尺寸对照</h1>
<p>图标按标注的 CSS 像素显示；请保持浏览器缩放为 100%。不以大图纹理代替小尺寸辨识度。</p>
<div class="grid">
<section class="panel"><h2>V7 · 细笔触旧版</h2>
<img class="large" src="summoning_circle_unfinished_charcoal_v7.png" alt="V7，256像素">
<div class="sizes">
<div class="cell"><img src="summoning_circle_unfinished_charcoal_v7.png" width="32" height="32" alt="V7，32像素"><small>32 × 32</small></div>
<div class="cell"><img src="summoning_circle_unfinished_charcoal_v7.png" width="64" height="64" alt="V7，64像素"><small>64 × 64</small></div>
<div class="cell"><img src="summoning_circle_unfinished_charcoal_v7.png" width="128" height="128" alt="V7，128像素"><small>128 × 128</small></div>
</div></section>
<section class="panel"><h2>V8 · 紧凑强线条版</h2>
<img class="large" src="summoning_circle_compact_icon_v8.png" alt="V8，256像素">
<div class="sizes">
<div class="cell"><img src="summoning_circle_compact_icon_v8.png" width="32" height="32" alt="V8，32像素"><small>32 × 32</small></div>
<div class="cell"><img src="summoning_circle_compact_icon_v8.png" width="64" height="64" alt="V8，64像素"><small>64 × 64</small></div>
<div class="cell"><img src="summoning_circle_compact_icon_v8.png" width="128" height="128" alt="V8，128像素"><small>128 × 128</small></div>
</div></section></div>
<div class="dark"><span>深色界面背景 · V8</span><img src="summoning_circle_compact_icon_v8.png" width="32" height="32" alt="深色背景32像素"><img src="summoning_circle_compact_icon_v8.png" width="64" height="64" alt="深色背景64像素"><img src="summoning_circle_compact_icon_v8.png" width="128" height="128" alt="深色背景128像素"></div>
<p class="note">检查重点：32px 下三分之四轮廓与中心仍可分辨；64px 下符文带与内环不糊成一团。图标细节在 32px 下必然简化，本页不是用户识别率测试。</p>
</main></html>
