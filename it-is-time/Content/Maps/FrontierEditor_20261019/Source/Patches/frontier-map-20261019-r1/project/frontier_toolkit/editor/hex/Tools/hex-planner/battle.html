<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>蜂窝战斗场景编辑器</title><link rel="stylesheet" href="battle.css"><link rel="stylesheet" href="content.css"></head><body>
<header><div class="brand"><strong>战斗场景 <span>HEX / BATTLE</span></strong><small>蜂窝涂色 · X / Z 平面 · 美术与规则分离</small></div><div class="actions"><span id="save-state">正在载入…</span><button id="undo" title="Ctrl+Z">撤销</button><button id="redo" title="Ctrl+Shift+Z">重做</button><button id="import">导入</button><button id="export">导出工作集</button><button id="battle-art-library" disabled>战场素材库</button><button id="save" class="primary" title="Ctrl+S">保存战场</button></div></header>
<div class="mapbar"><label>战场 <select id="battle-select" aria-label="选择战场模板"></select></label><button id="new-map">＋ 新建</button><button id="copy-map">复制战场</button><span id="source">14 个已存战场 · 保留原坐标与美术引用</span><button id="return-world">返回大地图</button></div>
<main><aside class="left"><h2>涂绘与摆放 <span>01</span></h2><div id="tools" class="tools"></div>
<div id="paint-options"><label>地面涂色<select id="ground"></select></label><label>边缘控制<select id="control"><option value="outside">红色 · 禁止进入</option><option value="allowed">绿色 · 允许区域</option><option value="breakable">橙色 · 破坏后通过</option><option value="clear">清除控制</option></select></label><label>笔刷<select id="brush"><option value="0">单格</option><option value="1">7 格</option><option value="2">19 格</option></select></label></div>
<p class="hint" id="tool-help">选择对象后拖动，吸附蜂窝。中键或空格拖动平移，滚轮缩放。</p>
<h2>独立显示图层 <span>02</span></h2><div id="layers"></div><button id="align-deployment" class="wide">双方部署水平对齐</button><button id="check" class="wide">检查部署与配置</button><button id="compile" class="wide">导出接入配置</button><a class="guide" href="battle-guide.html" target="_blank">操作与接入说明 ↗</a></aside>
<section class="workspace"><div class="canvasbar"><div><b id="view-title">战场布局</b><small id="dimensions"></small></div><div><button id="toggle-tools" class="compact">工具</button><button id="toggle-properties">属性</button><button id="preview">灰盒预览</button><button id="fit">全场</button><button id="zoom-out">−</button><span id="zoom">100%</span><button id="zoom-in">＋</button></div></div>
<div class="canvas-wrap"><canvas id="battle-canvas" tabindex="0" aria-label="蜂窝战场编辑画布"></canvas><div class="canvas-tip" id="canvas-tip">己方 / 敌方 / 效果 / 围边 · 独立涂层</div><div class="legend"><i style="--swatch:#599a83"></i>己方 <i style="--swatch:#c47470"></i>敌方 <i style="--swatch:#a298bd"></i>蛛网 <i style="--swatch:#ce9557"></i>可破坏</div></div>
<footer><span id="status" role="status">就绪</span><span id="cursor">X / Z</span></footer></section>
<aside class="right"><div class="property-tabs"><button id="object-tab" class="active">所选内容</button><button id="map-tab">场景设置</button><button id="issues-tab">检查</button></div><h2 id="selection-title">选择蜂窝或对象</h2><div id="properties"></div><div id="object-actions" hidden><button id="duplicate">复制 Ctrl+D</button><button id="delete" class="danger">删除 Delete</button></div><details id="advanced" hidden><summary>高级配置 JSON</summary><textarea id="advanced-json" spellcheck="false" aria-label="高级对象配置"></textarea><button id="apply-json">应用 JSON</button></details><div id="issues" hidden></div><div id="object-list"></div></aside></main>
<input type="file" id="file" accept=".json" hidden><dialog id="battle-art-dialog" class="content-library"><div class="library-top"><h2>战场素材库</h2><button id="close-battle-art">关闭</button></div><p>先选择战场对象，再点击素材替换外观；碰撞、效果与部署范围独立保留。</p><input id="battle-art-search" placeholder="搜索素材名称或 ID"><div id="battle-art-list" class="asset-grid"></div></dialog><script src="battle-legacy.js"></script><script src="battle-model.js"></script><script src="battle-deployment.js"></script><script src="battle-app.js"></script></body></html>
