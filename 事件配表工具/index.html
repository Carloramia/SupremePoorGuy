<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>怪诞手记 · 事件配表工具</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><a class="brand" href="#"><span class="sigil">◇</span><div>怪诞手记<small>NARRATIVE WORKBENCH</small></div></a><div class="project"><input id="project-name" aria-label="项目名称"><span id="save-status">本机草稿</span></div><div class="toolbar"><button id="help">使用说明</button><button id="import">导入</button><button id="save">保存项目</button><button id="excel">导出 Excel</button><button id="runtime" class="primary">导出 Godot JSON ↗</button></div></header>
<div class="workspace">
<aside class="sidebar"><div class="section-title">事件目录 <span id="event-count"></span></div><button id="new-event" class="new-event">＋ 新建事件</button><input id="search" type="search" placeholder="搜索名称 / ID" aria-label="搜索事件"><div id="event-list"></div><footer><span class="dot"></span> 离线编辑 · 不上传数据<br><small>自动保存只在当前浏览器生效<br>换电脑前请保存项目文件</small></footer></aside>
<main><section class="event-heading"><div><div class="eyebrow">STORY / CONFIGURATION</div><h1 id="event-title"></h1><p id="event-id"></p></div><div><button id="clone-event">复制事件</button><button id="delete-event" class="danger-text">删除事件</button></div></section><nav id="tabs" aria-label="配置分类"></nav><div class="editing"><section class="records"><div class="records-head"><div><h2 id="table-title"></h2><p id="table-note"></p></div><button id="add-record" class="primary">＋ 添加</button></div><div id="record-list"></div></section><section class="inspector"><div class="inspector-head"><h2>详细配置</h2><div><button id="move-up" title="上移">↑</button><button id="move-down" title="下移">↓</button><button id="clone-record" title="复制记录">复制</button><button id="delete-record" class="danger-text">删除</button></div></div><form id="fields" autocomplete="off"></form></section></div><section class="bottom-bar"><div id="summary"></div><button id="undo">↶ 撤销</button><button id="redo">↷ 重做</button><button id="validate">检查配置 <span id="issue-count"></span></button></section></main>
</div>
<dialog id="dialog"><div id="dialog-content"></div></dialog><input id="file-input" type="file" accept=".json,.xlsx" hidden><div id="toast" role="status"></div>
<script src="vendor/jszip.min.js"></script><script src="schema.js"></script><script src="seed.js"></script><script src="story.js"></script><script src="model.js"></script><script src="xlsx.js"></script><script src="app.js"></script>
</body></html>
